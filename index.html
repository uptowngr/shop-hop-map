<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uptown Shop Hop Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root{
    --evergreen:#108342; --santa:#e73221; --hearts:#f098c0; --blue:#2059fe;
    --grinchy:#98cb55; --sunshine:#fed000; --ink:#1d2a22; --muted:#55645a;
    --paid:#f098c0; --line-green:#00B050; --line-red:#e73221;
  }
  *{box-sizing:border-box}
  html{height:100%;overflow:hidden}
  body{position:fixed;inset:0;margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}
  html,body{color:var(--ink);
    font-family:"Franklin Gothic URC","Franklin Gothic Medium","Franklin Gothic","Arial Narrow",Arial,sans-serif;}
  #map{position:fixed;inset:0;width:100%;height:100%;height:100dvh}

  /* Top header card */
  .header{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;height:62px;
    background:rgba(255,255,255,.95);border-radius:18px;padding:10px 14px;
    box-shadow:0 4px 18px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--evergreen);font-size:17px;line-height:1.1}
  .brand small{display:block;color:var(--santa);font-size:12px;letter-spacing:.08em}
  .status{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}

  /* Filter button under the header */
  .filters{position:fixed;z-index:1000;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 82px)}
  .fbtn{height:36px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:0 16px;font-family:inherit;font-size:14px;font-weight:700;
    background:rgba(255,255,255,.96);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer}
  .fbtn.on{background:var(--evergreen);color:#fff}

  /* Filter sheet pieces */
  .flabel{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
  .chips::-webkit-scrollbar{display:none}
  .chips.wrap{flex-wrap:wrap;overflow:visible;padding:0}
  .chip{flex:none;height:34px;display:inline-flex;align-items:center;border:0;border-radius:999px;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer;
    background:#eef3ef;color:var(--ink);font-family:inherit;white-space:nowrap}
  .chip.on{background:var(--evergreen);color:#fff}
  .chip.on[data-district]{background:var(--dcolor);color:var(--dtext)}
  .field{width:100%;height:44px;border:1px solid #d4dbd6;border-radius:12px;padding:0 12px;font-family:inherit;font-size:15px;color:var(--ink);background:#fff}

  /* Bottom tab bar, two rows */
  .tabbar{position:fixed;z-index:1050;left:12px;right:12px;
    bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;
    background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-radius:22px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .tabrow{display:flex;gap:4px}
  .tab{flex:1;min-width:0;border:0;background:transparent;border-radius:999px;padding:9px 6px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab.on{background:var(--evergreen);color:#fff}

  /* Map pins */
  .pin{position:relative;width:34px;height:34px}
  .pin-dot{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .pin-elf{position:absolute;right:-6px;top:-8px;width:20px;height:20px;border-radius:50%;background:var(--sunshine);
    font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .pin-elf.found{background:var(--evergreen);color:#fff;font-weight:700;font-size:12px}
  .pin-label{position:absolute;left:40px;top:50%;transform:translateY(-50%);white-space:nowrap;
    background:rgba(255,255,255,.8);border-radius:8px;padding:2px 6px;font-size:12px;font-weight:700;
    box-shadow:0 1px 4px rgba(0,0,0,.2);display:none;pointer-events:none;color:var(--ink)}
  #map.show-labels .pin-label{display:block}
  #map .pin-label.hidden{display:none}
  .cluster{width:42px;height:42px;border-radius:50%;background:var(--evergreen);color:#fff;border:3px solid #fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .cluster.big{background:var(--santa)}
  .pk{width:30px;height:30px;border-radius:8px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);
    color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}
  .pk.free{background:var(--blue)}
  .pk.paid{background:var(--paid);color:var(--ink)}
  .tr{position:relative;width:32px;height:32px;border-radius:50%;background:#fff;border:4px solid #999;display:flex;align-items:center;justify-content:center;
    font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.3)}

  /* Sheets (business card, place card, lists, filters) */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;width:100%;background:#fff;border-radius:22px 22px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.2);transform:translateY(110%);
    transition:transform .38s cubic-bezier(.32,.72,0,1);max-height:46vh;max-height:46dvh;overflow-y:auto;overflow-x:hidden;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom))}
  .sheet.tall{max-height:80vh;max-height:80dvh}
  .sheet.open{transform:translateY(0)}
  .sheet > *{max-width:100%}
  .grab{width:42px;height:5px;border-radius:3px;background:#d4dbd6;margin:0 auto 10px}
  .xbtn{position:absolute;top:8px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:#eef3ef;
    font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);font-family:inherit;display:flex;align-items:center;justify-content:center}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:14px}
  .pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;color:#fff}
  .pill.plain{background:#eef3ef;color:var(--ink)}
  .cat{color:var(--muted);font-size:13px}
  .namerow{display:flex;align-items:center;gap:10px;margin:8px 0 2px}
  .name{font-size:24px;font-weight:700;margin:0;line-height:1.15;flex:1;min-width:0;overflow-wrap:anywhere}
  .addr{display:block;margin-top:6px;font-size:14px;color:var(--ink);text-decoration:underline;text-decoration-color:#b9c7bc;text-underline-offset:3px}
  .elfbadge{background:var(--sunshine);border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px}
  .turnin{display:inline-block;background:var(--santa);color:#fff;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px}
  .promo{background:#f4f8f2;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4;margin-top:10px;white-space:pre-line}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:stretch}
  .btn{flex:1 1 auto;min-width:0;border:0;border-radius:14px;padding:12px;font-weight:700;font-size:15px;text-align:center;
    text-decoration:none;cursor:pointer;color:var(--ink);background:#eef3ef;font-family:inherit;display:inline-block;white-space:nowrap}
  .btn.primary{background:var(--evergreen);color:#fff}
  .btn.small{flex:none;padding:10px 12px;font-size:14px}
  .heart{width:46px;height:46px;border-radius:50%;border:0;background:#fff0f6;font-size:22px;cursor:pointer;flex:none}
  .bounce{animation:bounce .45s}
  @keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.35)}65%{transform:scale(.9)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){.sheet{transition:none}.bounce{animation:none}}

  /* Info bars and lists */
  .notice{background:#fff7d6;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4;margin-top:10px}
  .notice summary{cursor:pointer;font-weight:700}
  .notice p{margin:8px 0 0}
  .small{font-size:12px;color:var(--muted)}
  .progress{height:10px;border-radius:999px;background:#e6efe8;overflow:hidden;margin-top:8px}
  .progress>div{height:100%;background:linear-gradient(90deg,var(--evergreen),var(--grinchy));transition:width .4s}
  .seg{display:flex;background:#eef3ef;border-radius:999px;padding:3px;margin-top:12px}
  .seg button{flex:1;min-width:0;border:0;background:transparent;padding:7px 4px;border-radius:999px;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
  .seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .elflist{margin-top:6px}
  .elfrow{border-top:1px solid #eef2ee;padding:12px 0}
  .elfrow .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px}
  .elfrow .top > div:first-child{min-width:0;flex:1}
  .elfrow .side{display:flex;flex-direction:column;gap:6px;flex:none}
  .elfname{font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
  .entry{display:flex;gap:6px;margin-top:8px}
  .entry input{flex:1;min-width:0;width:100%;border:1px solid #d4dbd6;border-radius:12px;padding:10px;font-family:inherit;font-size:15px;color:var(--ink)}
  .found-tag{color:var(--evergreen);font-weight:700;font-size:13px}
  .empty{color:var(--muted);font-size:14px;padding:16px 0;text-align:center}
  .detail{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
  .detail a{color:var(--evergreen);font-weight:700}
  .grouphead{margin-top:14px}
</style>
</head>
<body>

<div id="map"></div>

<div class="header">
  <div class="brand">Uptown<br>Shop Hop<small>Thu, Dec 3 · 3–9 PM</small></div>
  <div class="status" id="status">Loading shops…</div>
</div>

<div class="filters">
  <button class="fbtn" id="filterBtn">Filters</button>
</div>

<div class="sheet" id="sheet" aria-live="polite"></div>
<div class="sheet tall" id="filterSheet"></div>
<div class="sheet tall" id="elfSheet" aria-live="polite"></div>
<div class="sheet tall" id="favSheet" aria-live="polite"></div>
<div class="sheet tall" id="trollSheet" aria-live="polite"></div>
<div class="sheet tall" id="parkSheet" aria-live="polite"></div>

<nav class="tabbar">
  <div class="tabrow">
    <button class="tab on" id="tabMap">🗺 Map</button>
    <button class="tab" id="tabElf">🧝 Elf Hunt</button>
    <button class="tab" id="tabFav">❤️ Favorites</button>
  </div>
  <div class="tabrow">
    <button class="tab" id="tabTroll">🚋 Trolley</button>
    <button class="tab" id="tabPark">🅿️ Parking</button>
  </div>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
/* ==========================================================
   CONFIG — the only place to change links and settings
   ========================================================== */
const CONFIG = {
  // "Participating Businesses" tab, published as CSV
  businessesCsv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRt0Fie1CF7DBCj77kSxKlNxjfzG0xoLZ-FyWmix1f84PHqTDbIjcq-fFeCqkxtMz_SrlYrOBNW1nkm/pub?gid=2137669598&single=true&output=csv",
  // "Trolley Stops" and "Parking" tabs, each published as CSV
  trolleyCsv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRt0Fie1CF7DBCj77kSxKlNxjfzG0xoLZ-FyWmix1f84PHqTDbIjcq-fFeCqkxtMz_SrlYrOBNW1nkm/pub?gid=0&single=true&output=csv",
  parkingCsv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRt0Fie1CF7DBCj77kSxKlNxjfzG0xoLZ-FyWmix1f84PHqTDbIjcq-fFeCqkxtMz_SrlYrOBNW1nkm/pub?gid=1228700567&single=true&output=csv",
  tiles: "https://api.maptiler.com/maps/streets-v4/256/{z}/{x}/{y}.png?key=FvkmfrRMhQ3DpBY6YwvK",
  attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank" rel="noopener">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">&copy; OpenStreetMap contributors</a>',
  center: [42.9575, -85.6410],
  zoom: 14,
  labelZoom: 16,          // business names appear at this zoom and closer
  refreshMinutes: 5,
  // Categories offered in the dropdown (rows with other values still show on the map)
  categories: ["Clothing", "Foodie", "Pamper", "Trinket & Home Improvement", "Event"],
  elf: {
    goal: 20,                                  // names needed to turn in
    dates: "Nov 19 – Dec 18",
    turnIn: ["Sticky Fingers", "Vintage Charm"], // used if the sheet has no "Elf Turn-In" column
    email: "events@uptowngr.com",
  },
  trolleyInfo: "Trolleys are a fun and festive way to enjoy Uptown, but please do not rely on the trolleys as your main source of transportation, as the demand is incredibly high. Uptown is incredibly walkable, even between districts!",
};

const CACHE_KEY = "shophop.businesses.v1";
const PLACES_CACHE_KEY = "shophop.places.v1";
const FAV_KEY = "shophop.favs.v1";
const ELF_KEY = "shophop.elves.v1";
const LINE_COLOR = { Green: "#00B050", Red: "#e73221" };

// District brand colors (pin fill, pill, and chip when selected)
const DISTRICTS = {
  "Eastown":     { color: "#FF7124", text: "#ffffff" },
  "East Fulton": { color: "#0079C1", text: "#ffffff" },
  "East Hills":  { color: "#F2B134", text: "#1d2a22" },
  "Wealthy St":  { color: "#00B050", text: "#ffffff" },
};
const DISTRICT_ORDER = ["Eastown", "East Fulton", "East Hills", "Wealthy St"];
const FALLBACK_COLOR = { color: "#108342", text: "#ffffff" };
const colorFor = d => DISTRICTS[d] || FALLBACK_COLOR;

/* ----------------------------------------------------------
   Helpers
   ---------------------------------------------------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Proper CSV parser: handles quoted commas, doubled quotes, and line breaks inside quotes
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else quoted = false;
      } else field += c;
    } else if (c === '"') {
      quoted = true;
    } else if (c === ",") {
      row.push(field); field = "";
    } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}

// Accepts "42.9555, -85.6416" (either order) or DMS like 42°57'19.8"N 85°38'29.9"W
function parseCoords(s) {
  if (!s) return null;
  let m = s.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
  if (m) {
    const a = +m[1], b = +m[2];
    if (a > 40 && a < 45 && b < -80 && b > -90) return [a, b];   // lat, lng
    if (b > 40 && b < 45 && a < -80 && a > -90) return [b, a];   // lng, lat
    return null;
  }
  m = s.match(/(\d+)°\s*(\d+)'\s*([\d.]+)"?\s*([NS])\s*,?\s*(\d+)°\s*(\d+)'\s*([\d.]+)"?\s*([EW])/i);
  if (m) {
    const lat = (+m[1] + m[2] / 60 + m[3] / 3600) * (m[4].toUpperCase() === "S" ? -1 : 1);
    const lng = (+m[5] + m[6] / 60 + m[7] / 3600) * (m[8].toUpperCase() === "W" ? -1 : 1);
    return [lat, lng];
  }
  return null;
}

function normDistrict(s) {
  if (/wealthy/i.test(s)) return "Wealthy St";
  if (/east\s*fulton/i.test(s)) return "East Fulton";
  if (/east\s*hills/i.test(s)) return "East Hills";
  if (/eastown/i.test(s)) return "Eastown";
  return s || "Uptown";
}

// Opens the address in the phone's default maps app
function mapsUrl(item) {
  const dest = item.lat != null ? `${item.lat},${item.lng}` : encodeURIComponent(`${item.address}, Grand Rapids, MI`);
  if (/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)) return `https://maps.apple.com/?daddr=${dest}`;
  if (/Android/.test(navigator.userAgent)) return `geo:0,0?q=${dest}`;
  return `https://www.google.com/maps/search/?api=1&query=${dest}`;
}

const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

/* ----------------------------------------------------------
   Data layer: published sheets -> items
   Column names are matched by header (case, spaces, "?" ignored),
   so reordering columns in a sheet won't break the app.
   ---------------------------------------------------------- */
function normHeaders(rows) {
  return rows[0].map(h => h.trim().toLowerCase().replace(/\?/g, "").trim());
}

function toBusinesses(rows) {
  const head = normHeaders(rows);
  const find = (...names) => {
    for (const n of names) { const i = head.indexOf(n); if (i >= 0) return i; }
    return -1;
  };
  const idx = {
    name: find("business name", "name"),
    address: find("address"),
    district: find("district"),
    category: find("category"),
    elf: find("elf hunt"),
    turnIn: find("elf turn-in", "turn-in", "turn in"),
    hours: find("hours"),
    promo: find("event or promotion", "event / promotion", "event"),
    sponsor: find("sponsor"),
    coords: head.findIndex(h => h.includes("coord") || h.includes("lat")),
  };
  if (idx.name < 0) throw new Error('No "Business Name" column found in sheet');

  const seen = new Map();
  const list = [];
  for (const r of rows.slice(1)) {
    const get = i => (i >= 0 && r[i] != null ? r[i].trim() : "");
    const name = get(idx.name);
    if (!name) continue;
    const ll = parseCoords(get(idx.coords));
    let id = slug(name);
    const n = (seen.get(id) || 0) + 1; seen.set(id, n);
    if (n > 1) id += "-" + n;
    // The promo column is sometimes a Yes/No flag and sometimes a written description
    const promoRaw = get(idx.promo);
    const isFlag = /^(yes|no)$/i.test(promoRaw);
    list.push({
      kind: "biz",
      id, name,
      address: get(idx.address),
      district: normDistrict(get(idx.district)),
      category: get(idx.category) || "Other",
      elf: /^y/i.test(get(idx.elf)),
      turnIn: /^y/i.test(get(idx.turnIn)) ||
              CONFIG.elf.turnIn.some(t => t.toLowerCase() === name.toLowerCase()),
      hours: get(idx.hours),
      hasEvent: /^yes$/i.test(promoRaw) || (!isFlag && promoRaw !== ""),
      promo: isFlag ? "" : promoRaw,
      sponsor: /^y/i.test(get(idx.sponsor)),
      lat: ll ? ll[0] : null,
      lng: ll ? ll[1] : null,
    });
  }
  return list;
}

// Trolley stops (rows with a Stop #) and parking lots (rows without one)
function toPlaces(rows) {
  const head = normHeaders(rows);
  const find = pred => head.findIndex(pred);
  const idx = {
    stop: find(h => h.startsWith("stop")),
    line: find(h => h === "line" || h === "parking type" || h === "type"),
    name: find(h => h.includes("trolley stop name") || h === "name"),
    address: find(h => h === "address"),
    coords: find(h => h.includes("coord") || h.includes("lat")),
    closest: find(h => h.includes("closest")),
    spots: find(h => h.includes("parking spot")),
  };
  const out = [];
  for (const r of rows.slice(1)) {
    const get = i => (i >= 0 && r[i] != null ? r[i].trim() : "");
    const name = get(idx.name);
    if (!name) continue;
    const line = get(idx.line);
    const ll = parseCoords(get(idx.coords));
    const stop = get(idx.stop);
    const base = {
      name, address: get(idx.address), closest: get(idx.closest),
      lat: ll ? ll[0] : null, lng: ll ? ll[1] : null,
    };
    if (/^\d+$/.test(stop)) {
      const spotsRaw = get(idx.spots);
      out.push({
        ...base,
        kind: "troll", id: "t-" + stop, num: stop,
        lineName: /red/i.test(line) ? "Red" : /green/i.test(line) ? "Green" : "",
        transfer: /transfer/i.test(line),
        freePark: /free parking/i.test(line),
        spots: /^n\/a$/i.test(spotsRaw) || !spotsRaw ? [] : spotsRaw.split(/\s*[,;]\s*/).filter(Boolean),
      });
    } else {
      out.push({
        ...base,
        kind: "park", id: "p-" + slug(name),
        paid: /paid/i.test(line),
      });
    }
  }
  return out;
}

async function loadBusinesses() {
  try {
    const res = await fetch(CONFIG.businessesCsv, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const list = toBusinesses(parseCSV(await res.text()));
    if (!list.length) throw new Error("Sheet returned no businesses");
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(list)); } catch (e) {}
    return { list, source: "live" };
  } catch (err) {
    console.warn("Live sheet failed:", err);
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if (cached && cached.length) return { list: cached, source: "cached" };
    } catch (e) {}
    return { list: [], source: "none", error: String(err) };
  }
}

async function fetchTab(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return toPlaces(parseCSV(await res.text()));
}

// Each tab loads on its own, so one failing tab doesn't hide the other
async function loadPlaces() {
  const results = await Promise.allSettled([fetchTab(CONFIG.trolleyCsv), fetchTab(CONFIG.parkingCsv)]);
  results.forEach((r, i) => { if (r.status === "rejected") console.warn(["Trolley", "Parking"][i] + " tab failed:", r.reason); });
  if (results.some(r => r.status === "fulfilled")) {
    const list = results.filter(r => r.status === "fulfilled").flatMap(r => r.value);
    try { localStorage.setItem(PLACES_CACHE_KEY, JSON.stringify(list)); } catch (e) {}
    return list;
  }
  try { return JSON.parse(localStorage.getItem(PLACES_CACHE_KEY) || "[]"); }
  catch (e) { return []; }
}

/* ----------------------------------------------------------
   Favorites and Elf Hunt progress (saved on this device only)
   Favorites hold business, trolley, and parking ids (prefixed t- and p-)
   ---------------------------------------------------------- */
function getFavs() {
  try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]")); }
  catch (e) { return new Set(); }
}
function saveFavs(set) {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...set])); } catch (e) {}
}

// { businessId: "elf name" }
function getElves() {
  try { return JSON.parse(localStorage.getItem(ELF_KEY) || "{}"); }
  catch (e) { return {}; }
}
function saveElves(obj) {
  try { localStorage.setItem(ELF_KEY, JSON.stringify(obj)); } catch (e) {}
}

/* ----------------------------------------------------------
   Map
   ---------------------------------------------------------- */
// Two-pin clusters: stack them above and below instead of side by side.
// Three or more keep the default spread.
const _circleLayoutOriginal = L.MarkerCluster.prototype._generatePointsCircle;
L.MarkerCluster.prototype._generatePointsCircle = function (count, centerPt) {
  this._circleStartAngle = count === 2 ? Math.PI / 2 : 0;
  return _circleLayoutOriginal.call(this, count, centerPt);
};

const map = L.map("map", { zoomControl: false }).setView(CONFIG.center, CONFIG.zoom);
L.tileLayer(CONFIG.tiles, { tileSize: 256, maxZoom: 19, attribution: CONFIG.attribution }).addTo(map);

const cluster = L.markerClusterGroup({
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  maxClusterRadius: 50,
  iconCreateFunction: c => {
    const n = c.getChildCount();
    return L.divIcon({
      html: `<div class="cluster ${n > 25 ? "big" : ""}">${n}</div>`,
      className: "", iconSize: [42, 42],
    });
  },
});
map.addLayer(cluster);

// Parking and trolley pins sit on their own layers so they never get hidden in a business cluster
const parkLayer = L.layerGroup().addTo(map);
const trollLayer = L.layerGroup().addTo(map);

function updateLabelMode() {
  document.getElementById("map").classList.toggle("show-labels", map.getZoom() >= CONFIG.labelZoom);
}
map.on("zoomend", updateLabelMode);
map.on("zoomend moveend", () => setTimeout(updateLabelCollisions, 60));
updateLabelMode();

function pinIcon(b, elves) {
  const c = colorFor(b.district);
  let badge = "";
  if (b.elf) badge = elves[b.id] ? '<span class="pin-elf found">✓</span>' : '<span class="pin-elf">🧝</span>';
  return L.divIcon({
    className: "", iconSize: [34, 34], iconAnchor: [17, 17],
    html: `<div class="pin">
             <div class="pin-dot" style="background:${c.color}"></div>
             ${badge}
             <span class="pin-label">${esc(b.name)}</span>
           </div>`,
  });
}

function parkIcon(p) {
  return L.divIcon({
    className: "", iconSize: [30, 30], iconAnchor: [15, 15],
    html: `<div class="pk ${p.paid ? "paid" : "free"}">P</div>`,
  });
}

function trollIcon(t) {
  const color = LINE_COLOR[t.lineName] || "#999";
  return L.divIcon({
    className: "", iconSize: [32, 32], iconAnchor: [16, 16],
    html: `<div class="tr" style="border-color:${color}">🚏<span class="pin-label" style="color:${color}">#${esc(t.num)} ${esc(t.name)}</span></div>`,
  });
}

// Hide business names that would overlap a name already on screen (zoomed in only)
function updateLabelCollisions() {
  if (map.getZoom() < CONFIG.labelZoom) return;
  const items = [];
  for (const m of cluster.getLayers()) {
    const node = m.getElement && m.getElement();
    const label = node && node.querySelector(".pin-label");
    if (!label) continue;
    label.classList.remove("hidden");
    items.push({ label, m });
  }
  const taken = [];
  for (const { label, m } of items) {
    const p = map.latLngToContainerPoint(m.getLatLng());
    const w = label.offsetWidth, h = label.offsetHeight;
    const r = { x1: p.x + 40, y1: p.y - h / 2, x2: p.x + 40 + w, y2: p.y + h / 2 };
    if (taken.some(t => r.x1 < t.x2 && r.x2 > t.x1 && r.y1 < t.y2 && r.y2 > t.y1)) {
      label.classList.add("hidden");
    } else {
      taken.push(r);
    }
  }
}

/* ----------------------------------------------------------
   Filters (in a sheet opened by the Filters button).
   District, category, and Elf Hunt / Events / Favorites narrow the
   businesses on the map. Favorites also narrows parking and trolley pins.
   Parking and trolley layers are on by default.
   ---------------------------------------------------------- */
const filterState = {
  district: "All", category: "All", elf: false, events: false, favOnly: false,
  layers: { park: true, troll: true },
};
let businesses = [];
let places = [];
let byId = new Map();

const bizOf = () => businesses;
const placesOf = kind => places.filter(p => p.kind === kind);
const favItems = () => { const f = getFavs(); return [...businesses, ...places].filter(i => f.has(i.id)); };

function passes(b) {
  const favs = getFavs();
  return (filterState.district === "All" || b.district === filterState.district) &&
         (filterState.category === "All" || b.category === filterState.category) &&
         (!filterState.elf || b.elf) &&
         (!filterState.events || b.hasEvent) &&
         (!filterState.favOnly || favs.has(b.id));
}

function activeFilterCount() {
  return (filterState.district !== "All") + (filterState.category !== "All") +
         filterState.elf + filterState.events + filterState.favOnly;
}

function applyFilters(fit) {
  cluster.clearLayers();
  const elves = getElves();
  const shown = businesses.filter(passes);
  const markers = [];
  let unplaced = 0;
  for (const b of shown) {
    if (b.lat == null) { unplaced++; continue; }
    const m = L.marker([b.lat, b.lng], { icon: pinIcon(b, elves), title: b.name, keyboard: true });
    m.on("click", () => openSheet(b));
    markers.push(m);
  }
  cluster.addLayers(markers);
  renderLayers();
  if (fit && markers.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(0.15));
  updateStatus(shown.length, unplaced);
  updateChipCounts();
  setTimeout(updateLabelCollisions, 400);   // give clusters time to finish animating
}

// Parking and trolley pins, respecting the layer toggles and the Favorites filter
function renderLayers() {
  parkLayer.clearLayers();
  trollLayer.clearLayers();
  const favs = getFavs();
  const keep = p => !filterState.favOnly || favs.has(p.id);
  if (filterState.layers.park) {
    for (const p of placesOf("park")) {
      if (p.lat == null || !keep(p)) continue;
      L.marker([p.lat, p.lng], { icon: parkIcon(p), title: p.name, zIndexOffset: 1000 })
        .on("click", () => openPlaceCard(p)).addTo(parkLayer);
    }
  }
  if (filterState.layers.troll) {
    for (const t of placesOf("troll")) {
      if (t.lat == null || !keep(t)) continue;
      L.marker([t.lat, t.lng], { icon: trollIcon(t), title: `Stop ${t.num}: ${t.name}`, zIndexOffset: 1000 })
        .on("click", () => openPlaceCard(t)).addTo(trollLayer);
    }
  }
}

function updateStatus(shownCount, unplaced) {
  const total = businesses.length;
  const shownText = shownCount === total ? `${total} shops` : `${shownCount} of ${total} shops`;
  const missingNote = unplaced ? ` · ${unplaced} without map spots` : "";
  $("#status").textContent = `${shownText}${missingNote}`;
}

function chip(label, { on = false, onClick, extra = "" } = {}) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " on" : "");
  b.innerHTML = label;
  if (extra) b.dataset.district = extra;
  b.onclick = onClick;
  return b;
}

// Builds the filter sheet's contents and the Filters button label
function buildFilters() {
  const n = activeFilterCount();
  const btn = $("#filterBtn");
  btn.textContent = n ? `Filters · ${n}` : "Filters";
  btn.classList.toggle("on", n > 0);

  const counts = {
    elf: businesses.filter(b => b.elf).length,
    events: businesses.filter(b => b.hasEvent).length,
    favs: favItems().length,
    park: placesOf("park").length,
    troll: placesOf("troll").length,
  };

  const sheet = $("#filterSheet");
  sheet.innerHTML = `
    <button class="xbtn" data-close="filter" aria-label="Close">✕</button>
    <div class="grab"></div>
    <div class="name">Filters</div>
    <div class="flabel">District</div>
    <div class="chips wrap" id="fDistrict"></div>
    <div class="flabel">Category</div>
    <select class="field" id="fCategory" aria-label="Filter by category"></select>
    <div class="flabel">Show only</div>
    <div class="chips wrap" id="fToggles"></div>
    <div class="flabel">Map layers</div>
    <div class="chips wrap" id="fLayers"></div>
    <div class="actions">
      <button class="btn" id="fClear">Clear all</button>
      <button class="btn primary" data-close="filter">Show results</button>
    </div>`;

  const dc = $("#fDistrict");
  dc.appendChild(chip("All districts", {
    on: filterState.district === "All",
    onClick: () => setFilter(() => { filterState.district = "All"; }, true),
  }));
  for (const d of DISTRICT_ORDER) {
    const c = colorFor(d);
    const el = chip(d, {
      on: filterState.district === d,
      extra: d,
      onClick: () => setFilter(() => { filterState.district = filterState.district === d ? "All" : d; }, filterState.district !== "All"),
    });
    el.style.setProperty("--dcolor", c.color);
    el.style.setProperty("--dtext", c.text);
    dc.appendChild(el);
  }

  const sel = $("#fCategory");
  sel.innerHTML = `<option value="All">All categories</option>` +
    CONFIG.categories.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  sel.value = filterState.category;
  sel.onchange = () => setFilter(() => { filterState.category = sel.value; }, sel.value !== "All");

  const tg = $("#fToggles");
  tg.appendChild(chip(`🧝 Elf Hunt (${counts.elf})`, {
    on: filterState.elf,
    onClick: () => setFilter(() => { filterState.elf = !filterState.elf; }, true),
  }));
  tg.appendChild(chip(`🎉 Events (${counts.events})`, {
    on: filterState.events,
    onClick: () => setFilter(() => { filterState.events = !filterState.events; }, true),
  }));
  tg.appendChild(chip(`❤️ Favorites (${counts.favs})`, {
    on: filterState.favOnly,
    onClick: () => setFilter(() => { filterState.favOnly = !filterState.favOnly; }, true),
  }));

  // Layers are on/off and don't count as filters
  const ly = $("#fLayers");
  ly.appendChild(chip(`🅿️ Parking (${counts.park})`, {
    on: filterState.layers.park,
    onClick: () => setFilter(() => { filterState.layers.park = !filterState.layers.park; }, false),
  }));
  ly.appendChild(chip(`🚋 Trolley stops (${counts.troll})`, {
    on: filterState.layers.troll,
    onClick: () => setFilter(() => { filterState.layers.troll = !filterState.layers.troll; }, false),
  }));

  $("#fClear").onclick = () => {
    Object.assign(filterState, { district: "All", category: "All", elf: false, events: false, favOnly: false });
    applyFilters(true);
    buildFilters();
  };
}

// Runs a filter change, then refreshes the map and the sheet
function setFilter(change, fit) {
  change();
  applyFilters(fit);
  buildFilters();
}

// Updates the Favorites tab count and the filter sheet counts
function updateChipCounts() {
  const favCount = favItems().length;
  $("#tabFav").textContent = `❤️ Favorites${favCount ? ` (${favCount})` : ""}`;
  if ($("#filterSheet").classList.contains("open")) buildFilters();
  else {
    const n = activeFilterCount();
    $("#filterBtn").textContent = n ? `Filters · ${n}` : "Filters";
    $("#filterBtn").classList.toggle("on", n > 0);
  }
}

// Fly to a district's businesses
function focusDistrict(d) {
  const pts = businesses.filter(b => b.district === d && b.lat != null).map(b => [b.lat, b.lng]);
  if (pts.length) map.flyToBounds(pts, { padding: [140, 40], maxZoom: 16 });
}

/* ----------------------------------------------------------
   Panels: map, business card, place card, Elf Hunt, Favorites,
   Filters, Trolley, Parking
   ---------------------------------------------------------- */
let currentBusiness = null;
const PANELS = ["sheet", "filterSheet", "elfSheet", "favSheet", "trollSheet", "parkSheet"];
const TAB_IDS = { map: "tabMap", elf: "tabElf", fav: "tabFav", troll: "tabTroll", park: "tabPark" };

function setTab(which) {
  for (const [k, id] of Object.entries(TAB_IDS)) $("#" + id).classList.toggle("on", k === which);
}

function closeAllPanels() {
  for (const id of PANELS) $("#" + id).classList.remove("open");
  currentBusiness = null;
}

// Back to the map (used by the Map tab and every ✕)
function goMap() {
  closeAllPanels();
  setTab("map");
}

// Fly to any item and open its card (used by Show on map, Locate, and Favorites)
function showOnMap(item) {
  goMap();
  if (item.lat != null) map.flyTo([item.lat, item.lng], Math.max(map.getZoom(), 17));
  if (item.kind === "biz") openSheet(item);
  else openPlaceCard(item);
}

/* ----------------------------------------------------------
   Business card
   ---------------------------------------------------------- */
function elfSection(b) {
  if (!b.elf && !b.turnIn) return "";
  const name = getElves()[b.id] || "";
  let html = "";
  if (b.turnIn) {
    html += `<div class="row"><span class="turnin">🧝 Elf Hunt turn-in spot</span></div>
             <div class="cat">Bring your completed game card here for your prize and drawing entry.</div>`;
  }
  if (b.elf) {
    html += `<div class="entry">
               <input id="elfName" maxlength="40" placeholder="Name of the elf you found" value="${esc(name)}">
               <button class="btn primary small" id="saveElf">${name ? "Update" : "Found it!"}</button>
             </div>`;
    if (name) html += `<div class="row found-tag">✓ Saved on this phone</div>`;
  }
  return html;
}

function openSheet(b) {
  currentBusiness = b;
  const isFav = getFavs().has(b.id);
  const c = colorFor(b.district);
  const sheet = $("#sheet");
  sheet.innerHTML = `
    <button class="xbtn" id="closeCard" aria-label="Close">✕</button>
    <div class="grab"></div>
    <div class="row">
      <span class="pill" style="background:${c.color};color:${c.text}">${esc(b.district)}</span>
      ${b.category ? `<span class="cat">${esc(b.category)}</span>` : ""}
    </div>
    <div class="namerow">
      <div class="name">${esc(b.name)}</div>
      <button class="heart" id="fav" aria-label="Save to favorites">${isFav ? "❤️" : "🤍"}</button>
    </div>
    ${b.elf ? '<div class="row"><span class="elfbadge">🧝 Elf Hunt location</span></div>' : ""}
    <div class="row">🕒 ${esc(b.hours || "Hours coming soon")}</div>
    ${b.address ? `<a class="addr" href="${mapsUrl(b)}">📍 ${esc(b.address)}</a>` : ""}
    ${b.promo ? `<div class="promo">${esc(b.promo)}</div>`
      : b.hasEvent ? `<div class="promo">✨ Shop Hop special happening here. Details coming soon.</div>` : ""}
    ${elfSection(b)}`;
  $("#closeCard").onclick = closeSheet;
  $("#fav").onclick = () => toggleFav(b);
  if ($("#saveElf")) $("#saveElf").onclick = () => markElf(b, $("#elfName").value);

  sheet.classList.add("open");
  if (b.lat != null) map.panTo([b.lat, b.lng]);
}

function closeSheet() {
  $("#sheet").classList.remove("open");
  currentBusiness = null;
}

/* ----------------------------------------------------------
   Trolley stop and parking lot cards
   ---------------------------------------------------------- */
function placePills(p) {
  if (p.kind === "troll") {
    const color = LINE_COLOR[p.lineName] || "#999";
    return `<span class="pill" style="background:${color}">${esc(p.lineName || "Trolley")} line</span>` +
           (p.transfer ? `<span class="pill plain">Transfer</span>` : "");
  }
  return p.paid
    ? `<span class="pill" style="background:var(--paid);color:var(--ink)">City parking · paid</span>`
    : `<span class="pill" style="background:var(--blue)">Free parking</span>`;
}

function openPlaceCard(p) {
  currentBusiness = null;
  const isFav = getFavs().has(p.id);
  const sheet = $("#sheet");
  sheet.innerHTML = `
    <button class="xbtn" id="closeCard" aria-label="Close">✕</button>
    <div class="grab"></div>
    <div class="row">${placePills(p)}</div>
    <div class="namerow">
      <div class="name">${p.kind === "troll" ? `Stop ${esc(p.num)} · ` : ""}${esc(p.name)}</div>
      <button class="heart" id="fav" aria-label="Save to favorites">${isFav ? "❤️" : "🤍"}</button>
    </div>
    ${p.kind === "troll" && p.freePark ? `<div class="row"><span class="pill" style="background:var(--blue)">Free parking near this stop</span></div>` : ""}
    ${p.address ? `<a class="addr" href="${mapsUrl(p)}">📍 ${esc(p.address)}</a>` : ""}
    ${p.closest ? `<div class="row">Closest business: ${esc(p.closest)}</div>` : ""}
    ${p.kind === "troll" && p.spots.length ? `<div class="row">Parking spots: ${esc(p.spots.join(", "))}</div>` : ""}`;
  $("#closeCard").onclick = closeSheet;
  $("#fav").onclick = () => toggleFav(p);
  sheet.scrollTop = 0;
  sheet.classList.add("open");
  if (p.lat != null) map.panTo([p.lat, p.lng]);
}

function toggleFav(item) {
  const favs = getFavs();
  if (favs.has(item.id)) favs.delete(item.id); else favs.add(item.id);
  saveFavs(favs);
  const btn = $("#fav");
  if (btn) {
    btn.textContent = favs.has(item.id) ? "❤️" : "🤍";
    btn.classList.remove("bounce"); void btn.offsetWidth; btn.classList.add("bounce");
  }
  // If the Favorites filter is on, the map changes right away
  if (filterState.favOnly) applyFilters(false);
  else renderLayers();
  updateChipCounts();
  if ($("#favSheet").classList.contains("open")) renderFavList();
  if ($("#trollSheet").classList.contains("open")) renderTrolleyList();
  if ($("#parkSheet").classList.contains("open")) renderParkingList();
}

/* ----------------------------------------------------------
   Elf Hunt: saving names, progress, and the tab
   ---------------------------------------------------------- */
let elfView = { district: "All", view: "all" };   // view: all | todo | found

function markElf(b, value) {
  const names = getElves();
  const clean = String(value || "").trim().slice(0, 40);
  if (clean) names[b.id] = clean; else delete names[b.id];
  saveElves(names);
  if (currentBusiness === b) openSheet(b);     // refresh the card
  applyFilters(false);                          // refresh pins (checkmarks)
  if ($("#elfSheet").classList.contains("open") && document.activeElement?.tagName !== "INPUT") renderElfList();
}

function openElf() {
  closeAllPanels();
  renderElfList();
  $("#elfSheet").classList.add("open");
  setTab("elf");
}

function renderElfList() {
  const names = getElves();
  const all = businesses.filter(b => b.elf);
  const got = all.filter(b => names[b.id]);
  const goal = CONFIG.elf.goal;
  const pct = Math.min(100, (got.length / goal) * 100);
  const ready = got.length >= goal;

  const list = all
    .filter(b => elfView.district === "All" || b.district === elfView.district)
    .filter(b => elfView.view === "all" || (elfView.view === "found") === !!names[b.id])
    .sort((a, b) => a.district.localeCompare(b.district) || a.name.localeCompare(b.name));

  const listText = got.map((b, i) => `${i + 1}. ${names[b.id]}`).join("\n");
  const mailBody = encodeURIComponent(`Shop Hop Elf Hunt entries\n\n${listText}\n\nName:\nPhone:`);
  const mailto = `mailto:${CONFIG.elf.email}?subject=${encodeURIComponent("Shop Hop Elf Hunt entries")}&body=${mailBody}`;

  const countFor = v => all.filter(b => v === "all" || (v === "found") === !!names[b.id]).length;
  const seg = [["all", "All"], ["todo", "To find"], ["found", "Found"]]
    .map(([v, label]) => `<button data-view="${v}" class="${elfView.view === v ? "on" : ""}">${label} (${countFor(v)})</button>`)
    .join("");

  const chips = ["All", ...DISTRICT_ORDER].map(d => {
    const on = elfView.district === d;
    const c = d === "All" ? null : colorFor(d);
    const style = on && c ? `background:${c.color};color:${c.text}` : "";
    return `<button class="chip ${on ? "on" : ""}" data-district-filter="${d}" style="${style}">${d === "All" ? "All districts" : esc(d)}</button>`;
  }).join("");

  const rows = list.length ? list.map(b => {
    const c = colorFor(b.district);
    const saved = names[b.id] || "";
    return `
      <div class="elfrow">
        <div class="top">
          <div>
            <div class="elfname">${esc(b.name)}</div>
            <div class="cat" style="font-size:12px">${esc(b.category)}</div>
            <div class="row" style="margin-top:4px">
              <span class="pill" style="background:${c.color};color:${c.text}">${esc(b.district)}</span>
              ${b.turnIn ? '<span class="turnin">Turn-in spot</span>' : ""}
            </div>
          </div>
          <button class="btn small" data-locate="${b.id}">📍 Locate</button>
        </div>
        <div class="entry">
          <input data-elf="${b.id}" maxlength="40" placeholder="Elf's name" value="${esc(saved)}">
          <button class="btn primary small" data-save="${b.id}">${saved ? "Update" : "Save"}</button>
        </div>
        ${saved ? '<div class="found-tag">✓ Found</div>' : ""}
      </div>`;
  }).join("") : `<div class="empty">Nothing here yet. Try another filter.</div>`;

  $("#elfSheet").innerHTML = `
    <button class="xbtn" data-close="elf" aria-label="Back to map">✕</button>
    <div class="grab"></div>
    <div class="name">🧝 Elf Hunt</div>
    <details class="notice" open>
      <summary>How it works · ${esc(CONFIG.elf.dates)}</summary>
      <p>Find the elves hiding in participating shop windows, and write each elf's name on your paper game card. Collect ${goal} names.</p>
      <p>Turn in your completed card at <b>${CONFIG.elf.turnIn.join("</b> or <b>")}</b> for a small prize. Entries completed by Dec 18 are also entered into a drawing for one of five $150 gift cards to an Uptown business of your choice.</p>
      <p class="small">Your progress is saved on this phone only. If you switch phones or clear your browser, it will be lost.</p>
    </details>

    <div class="row" style="margin-top:12px"><b>${got.length} of ${goal} names</b>${ready ? " · 🎉 Ready to turn in!" : ""}</div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    ${ready ? `<div class="actions">
        <a class="btn primary" href="${mailto}">Email my list</a>
        <button class="btn" id="copyList">Copy list</button>
      </div>` : ""}

    <div class="seg" id="elfSeg">${seg}</div>
    <div class="chips" style="padding-left:0">${chips}</div>
    <div class="elflist">${rows}</div>`;
}

/* ----------------------------------------------------------
   Shared list rows for Favorites, Trolley, and Parking
   ---------------------------------------------------------- */
function heartLabel(item) { return getFavs().has(item.id) ? "❤️" : "🤍"; }

function placeRow(p) {
  return `
    <div class="elfrow">
      <div class="top">
        <div>
          <div class="elfname">${p.kind === "troll" ? `Stop ${esc(p.num)} · ` : ""}${esc(p.name)}</div>
          <div class="row" style="margin-top:4px">${placePills(p)}${p.kind === "troll" && p.freePark ? `<span class="pill" style="background:var(--blue)">Free parking</span>` : ""}</div>
          ${p.address ? `<div class="detail">${esc(p.address)}</div>` : ""}
          ${p.closest ? `<div class="detail">Closest business: ${esc(p.closest)}</div>` : ""}
          ${p.kind === "troll" && p.spots.length ? `<div class="detail">Parking spots: ${esc(p.spots.join(", "))}</div>` : ""}
          <div class="detail"><a href="${mapsUrl(p)}">🧭 Directions</a></div>
        </div>
        <div class="side">
          <button class="btn small" data-show="${p.id}">📍 Show on map</button>
          <button class="btn small" data-fav="${p.id}" aria-label="Save to favorites">${heartLabel(p)}</button>
        </div>
      </div>
    </div>`;
}

function renderTrolleyList() {
  const list = placesOf("troll").sort((a, b) => Number(a.num) - Number(b.num));
  $("#trollSheet").innerHTML = `
    <button class="xbtn" data-close="troll" aria-label="Back to map">✕</button>
    <div class="grab"></div>
    <div class="name">🚋 Trolley Stops</div>
    <div class="notice">${esc(CONFIG.trolleyInfo)}</div>
    <div class="elflist">${list.length ? list.map(placeRow).join("") : `<div class="empty">Trolley stops will show up here once they're connected.</div>`}</div>`;
}

function renderParkingList() {
  const free = placesOf("park").filter(p => !p.paid).sort((a, b) => a.name.localeCompare(b.name));
  const paid = placesOf("park").filter(p => p.paid).sort((a, b) => a.name.localeCompare(b.name));
  const section = (title, items) => items.length
    ? `<div class="flabel grouphead">${title}</div>${items.map(placeRow).join("")}` : "";
  $("#parkSheet").innerHTML = `
    <button class="xbtn" data-close="park" aria-label="Back to map">✕</button>
    <div class="grab"></div>
    <div class="name">🅿️ Parking</div>
    ${section("Free parking", free)}
    ${section("City parking · paid", paid)}
    ${!free.length && !paid.length ? `<div class="empty">Parking will show up here once it's connected.</div>` : ""}`;
}

function renderFavList() {
  const list = favItems().sort((a, b) => {
    const order = { biz: 0, troll: 1, park: 2 };
    return (order[a.kind] - order[b.kind]) || a.name.localeCompare(b.name);
  });
  const names = getElves();
  const rows = list.length ? list.map(item => {
    if (item.kind !== "biz") return placeRow(item);
    const c = colorFor(item.district);
    let elfNote = "";
    if (item.elf) elfNote = names[item.id] ? '<span class="found-tag">🧝 ✓ Found</span>' : '<span class="small">🧝 Elf Hunt location</span>';
    return `
      <div class="elfrow">
        <div class="top">
          <div>
            <div class="elfname">${esc(item.name)}</div>
            <div class="cat" style="font-size:12px">${esc(item.category)}</div>
            <div class="row" style="margin-top:4px">
              <span class="pill" style="background:${c.color};color:${c.text}">${esc(item.district)}</span>
              ${elfNote}
            </div>
          </div>
          <div class="side">
            <button class="btn small" data-show="${item.id}">📍 Show on map</button>
            <button class="btn small" data-fav="${item.id}" aria-label="Remove from favorites">❤️</button>
          </div>
        </div>
      </div>`;
  }).join("") : `<div class="empty">No favorites yet. Tap 🤍 on any shop, trolley stop, or parking lot to save it here.</div>`;

  $("#favSheet").innerHTML = `
    <button class="xbtn" data-close="fav" aria-label="Back to map">✕</button>
    <div class="grab"></div>
    <div class="name">❤️ Favorites</div>
    <div class="small" style="margin-top:4px">${list.length} saved on this phone</div>
    <div class="elflist">${rows}</div>`;
}

function openFav() {
  closeAllPanels();
  renderFavList();
  $("#favSheet").classList.add("open");
  setTab("fav");
}

function openTrolley() {
  closeAllPanels();
  renderTrolleyList();
  $("#trollSheet").classList.add("open");
  setTab("troll");
}

function openParking() {
  closeAllPanels();
  renderParkingList();
  $("#parkSheet").classList.add("open");
  setTab("park");
}

function openFilters() {
  closeAllPanels();
  buildFilters();
  $("#filterSheet").classList.add("open");
  setTab("map");
}

/* ----------------------------------------------------------
   Taps inside lists
   ---------------------------------------------------------- */
// Elf Hunt tab
$("#elfSheet").addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.dataset.view) { elfView.view = t.dataset.view; renderElfList(); return; }
  if (t.dataset.districtFilter) { elfView.district = t.dataset.districtFilter; renderElfList(); return; }
  if (t.dataset.save) {
    const b = businesses.find(x => x.id === t.dataset.save);
    const input = document.querySelector(`[data-elf="${t.dataset.save}"]`);
    if (b && input) markElf(b, input.value);
    renderElfList();
    return;
  }
  if (t.dataset.locate) {
    const b = businesses.find(x => x.id === t.dataset.locate);
    if (b) showOnMap(b);
    return;
  }
  if (t.id === "copyList") {
    const names = getElves();
    const text = businesses.filter(b => b.elf && names[b.id]).map((b, i) => `${i + 1}. ${names[b.id]}`).join("\n");
    navigator.clipboard.writeText(text)
      .then(() => { t.textContent = "Copied!"; })
      .catch(() => { t.textContent = "Couldn't copy"; });
  }
});

// Favorites, Trolley, and Parking tabs share the same Show on map and heart buttons
function onListClick(e) {
  const show = e.target.closest("[data-show]");
  if (show) { const item = byId.get(show.dataset.show); if (item) showOnMap(item); return; }
  const fav = e.target.closest("[data-fav]");
  if (fav) { const item = byId.get(fav.dataset.fav); if (item) toggleFav(item); }
}
for (const id of ["favSheet", "trollSheet", "parkSheet"]) $("#" + id).addEventListener("click", onListClick);

// Every ✕ in the panels returns to the map
document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) goMap();
});

/* ----------------------------------------------------------
   Sheet interactions: swipe down to close, tap map to close the card
   ---------------------------------------------------------- */
function addSwipeToClose(el, onClose) {
  let startY = null;
  el.addEventListener("touchstart", e => { startY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener("touchend", e => {
    if (startY != null && el.scrollTop === 0 && e.changedTouches[0].clientY - startY > 60) onClose();
    startY = null;
  });
}
addSwipeToClose($("#sheet"), closeSheet);
for (const id of ["filterSheet", "elfSheet", "favSheet", "trollSheet", "parkSheet"]) {
  addSwipeToClose($("#" + id), goMap);
}
map.on("click", closeSheet);

$("#tabMap").onclick = goMap;
$("#tabElf").onclick = openElf;
$("#tabFav").onclick = openFav;
$("#tabTroll").onclick = openTrolley;
$("#tabPark").onclick = openParking;
$("#filterBtn").onclick = openFilters;

/* ----------------------------------------------------------
   Startup + periodic refresh from the sheets
   ---------------------------------------------------------- */
let firstLoad = true;
async function init() {
  const [{ list, source }, placeList] = await Promise.all([loadBusinesses(), loadPlaces()]);
  if (source === "none") {
    $("#status").textContent = "Couldn't load shops. Check your connection and refresh.";
    return;
  }
  businesses = list;
  places = placeList;
  byId = new Map([...businesses, ...places].map(i => [i.id, i]));
  buildFilters();
  applyFilters(firstLoad);
  $("#status").textContent += ` · ${source === "live" ? "live" : "saved copy"}`;
  if ($("#elfSheet").classList.contains("open") && document.activeElement?.tagName !== "INPUT") renderElfList();
  if ($("#favSheet").classList.contains("open")) renderFavList();
  if ($("#trollSheet").classList.contains("open")) renderTrolleyList();
  if ($("#parkSheet").classList.contains("open")) renderParkingList();
  firstLoad = false;
}

init();
setInterval(init, CONFIG.refreshMinutes * 60 * 1000);
</script>
</body>
</html>
